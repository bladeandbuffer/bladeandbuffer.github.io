<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Michael Mikheev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --text: #f4f4f4;
      --muted: #e0e0e0;
      --accent: #fcd54e;
      --accent-text: #c28d2d;
      --callout-text-offset-x: 0px;
      --callout-text-offset-y: -9px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 0;
    }

    main.hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-direction: column;
      padding: 56px 24px 72px;
    }

    .hero-inner {
      width: min(960px, 100%);
      display: grid;
      gap: 24px;
      justify-items: center;
      text-align: center;
    }

    header .logo {
      font-family: 'Open Sans', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: clamp(34px, 6vw, 52px);
      letter-spacing: -0.17em;
      text-transform: uppercase;
      color: #fff;
    }

    .callout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
      width: min(760px, 100%);
      margin-bottom: 4px;
    }

    .callout-line {
      position: relative;
      flex: 1 1 160px;
      height: 22px;
      border-top: 2px solid var(--muted);
    }

    .callout-line.left {
      border-left: 2px solid var(--muted);
      border-top-left-radius: 12px;
    }

    .callout-line.right {
      border-right: 2px solid var(--muted);
      border-top-right-radius: 12px;
    }

    .callout-line.left::after,
    .callout-line.right::after {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid var(--muted);
      top: 20px;
    }

    .callout-line.left::after {
      right: 241px;
    }

    .callout-line.right::after {
      left: 241px;
    }

    .callout-text {
      font-size: 16px;
      white-space: nowrap;
      display: inline-block;
      transform: translate(var(--callout-text-offset-x), var(--callout-text-offset-y));
    }

    .toggle-area {
      display: grid;
      gap: 8px;
      justify-items: center;
      width: 100%;
    }

    .toggle-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 800;
      padding: 0 12px 14px;
      text-transform: capitalize;
    }

    .toggle-bar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: repeating-linear-gradient(to right,
          #e6e6e6 0,
          #e6e6e6 4px,
          transparent 4px,
          transparent 10px);
      opacity: 0.9;
      pointer-events: none;
    }

    .toggle-bar .mark {
      color: #fff;
      opacity: 0.9;
      letter-spacing: 0.01em;
    }

    .toggle {
      background: transparent;
      border: none;
      color: #fff;
      padding: 6px 10px;
      font: inherit;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      outline: none;
    }

    .toggle:hover {
      transform: translateY(-1px);
    }

    .toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .toggle.is-active {
      background: var(--accent);
      color: #2c1f00;
    }

    .state-hint {
      font-size: 13px;
      color: #b0b0b0;
      min-height: 18px;
    }

    .badge {
      margin-top: 12px;
      width: min(600px, 90vw);
      background: var(--accent);
      color: var(--accent-text);
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 800;
      padding: 16px 20px;
      border-radius: 4px;
      text-align: center;
    }

    .badgeMore {
      margin-top: 0px;
      width: min(600px, 90vw);
      background: #1a1a1a;
      color: #444444;
      font-size: clamp(10px, 3vw, 16px);
      font-weight: 800;
      padding: 16px 20px;
      border-radius: 4px;
      text-align: center;
    }

    .content-stage {
      width: min(760px, 100%);
      min-height: 320px;
      display: grid;
      gap: 14px;
      align-content: start;
      justify-items: center;
    }

    .demo-block {
      width: min(600px, 90vw);
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 14px 16px;
      color: #eaeaea;
      background: #111;
      text-align: center;
      display: none;
      overflow: hidden;
    }

    .demo-block.is-visible {
      display: block;
    }

    /* Read-more collapsible */
    .read-more-body {
      position: relative;
      overflow: hidden;
      max-height: 600px;
      transition: max-height 0.4s ease;
    }

    .read-more-body.is-expanded {
      max-height: 2000px;
    }

    .read-more-body:not(.is-expanded)::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: linear-gradient(to bottom, transparent, #111);
      pointer-events: none;
    }

    .read-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      background: transparent;
      border: 1px solid #3a3a3a;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .read-more-btn:hover {
      background: rgba(252, 213, 78, 0.08);
      border-color: var(--accent);
    }

    .read-more-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .read-more-btn .btn-arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .read-more-btn.is-expanded .btn-arrow {
      transform: rotate(180deg);
    }

    .demo-image {
      width: 100%;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      display: block;
      object-fit: cover;
      max-height: 320px;
      height: auto;
      cursor: zoom-in;
    }

    .demo-noborder-image {
      width: 100%;
      max-width: 100%;
      border-radius: 8px;
      border: 0px solid #2a2a2a;
      display: block;
      object-fit: cover;
      max-height: 320px;
      height: auto;
      cursor: zoom-in;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      padding: 32px;
      z-index: 1000;
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-dialog {
      position: relative;
      width: min(1200px, calc(100vw - 80px));
      max-height: calc(100vh - 80px);
      border-radius: 12px;
      border: 1px solid #3a3a3a;
      background: #0f0f0f;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      padding: 14px;
      display: grid;
      place-items: center;
    }

    .lightbox-image {
      width: auto;
      max-width: 100%;
      max-height: calc(100vh - 140px);
      border-radius: 8px;
      display: block;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      border: 1px solid #575757;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .lightbox-close:hover {
      border-color: #8a8a8a;
    }

    .tagline {
      margin: 10px 5px;
      font-size: small;
      color: #fcd54e;
      text-align: center;
      font-style: italic;
    }

    .lightbox-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* To-the-top button */
    .to-top-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid #3a3a3a;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.25s ease, transform 0.25s ease;
      z-index: 900;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .to-top-btn.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .to-top-btn:hover {
      background: rgba(252, 213, 78, 0.08);
      border-color: var(--accent);
    }

    .to-top-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .to-top-btn .btn-arrow {
      display: inline-block;
      transform: rotate(180deg);
    }

    @media (max-width: 600px) {
      .callout {
        gap: 8px;
      }

      .callout-line {
        flex-basis: 110px;
      }

      .callout-text {
        white-space: normal;
      }

      .toggle-bar {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="hero-inner">
      <header>
        <div class="logo" aria-label="Michael Mikheev logo"><b>Michael Mikheev</b></div>
      </header>

      <div class="callout" aria-hidden="true">
        <span class="callout-line left"></span>
        <span class="callout-text">Choose your destiny. Set rules.</span>
        <span class="callout-line right"></span>
      </div>

      <div class="toggle-area" aria-label="Discipline toggles">
        <div class="toggle-bar">
          <button class="toggle" type="button" data-group="primary" data-key="technical" data-label="Technical"
            aria-pressed="false">(Technical)</button>
          <button class="toggle" type="button" data-group="primary" data-key="level" data-label="Level"
            aria-pressed="false">(Level)</button>
          <button class="toggle" type="button" data-group="primary" data-key="game" data-label="Game"
            aria-pressed="false">(Game)</button>
          <span class="mark">-</span>
          <button class="toggle" type="button" data-group="secondary" data-key="artist" data-label="Artist"
            aria-pressed="false">(Artist)</button>
          <button class="toggle" type="button" data-group="secondary" data-key="designer" data-label="Desiner"
            aria-pressed="false">(Designer)</button>
        </div>
        <div class="state-hint" aria-live="polite">Active: All off</div>
      </div>

      <section class="badge" aria-label="Experience">
        7+ years in Game Development
      </section>

      <section class="badgeMore" aria-label="Experience">
        | UNITY | UNREAL | C# | BLUEPRINTS |<br>
        | PHOTOSHOP | ILLUSTRATOR | DOTWEEN | FEEL | BLENDER |
      </section>

      <section class="content-stage" aria-label="Filtered content">
        <section class="demo-block" data-requires="technical,artist | game,artist"
          data-block="blocks/artist-technical.html" aria-live="polite">
        </section>

        <section class="demo-block" data-requires="game,artist | technical,artist | technical,designer"
          data-block="blocks/animation-2d.html" aria-live="polite">
        </section>

        <section class="demo-block" data-requires="technical,artist | technical,designer"
          data-block="blocks/csharp.html" aria-live="polite">
        </section>

        <section class="demo-block" data-requires="game,artist | technical,artist" data-block="blocks/art-2d.html"
          aria-live="polite">
        </section>
      </section>

    </div>
  </main>

  <button class="to-top-btn" id="to-top-btn" type="button" aria-label="Back to top">
    <span class="btn-arrow" aria-hidden="true">&#9660;</span>
    <span class="btn-label">To The Top</span>
  </button>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
      <button class="lightbox-close" type="button" id="lightbox-close" aria-label="Close preview">&times;</button>
      <img class="lightbox-image" id="lightbox-image" alt="">
    </div>
  </div>

  <script>
    // ─── Helpers ───────────────────────────────────────────────────────────
    const toggles = Array.from(document.querySelectorAll('.toggle'));
    const stateHint = document.querySelector('.state-hint');
    const lightbox = document.querySelector('#lightbox');
    const lightboxImage = document.querySelector('#lightbox-image');
    const lightboxClose = document.querySelector('#lightbox-close');
    const state = Object.fromEntries(toggles.map(btn => [btn.dataset.key, false]));

    const labelFor = key => {
      const btn = toggles.find(b => b.dataset.key === key);
      return btn ? (btn.dataset.label || btn.textContent.trim()) : key;
    };

    // ─── Filter / toggle logic ─────────────────────────────────────────────
    let conditionalBlocks = [];

    const rebuildConditionalBlocks = () => {
      conditionalBlocks = Array.from(document.querySelectorAll('[data-requires]')).map(block => {
        const combinations = block.dataset.requires
          .split('|')
          .map(combo => combo.split(',').map(s => s.trim()).filter(Boolean))
          .filter(combo => combo.length > 0);
        return { block, combinations };
      });
    };

    const updateState = () => {
      const active = Object.keys(state).filter(key => state[key]);
      toggles.forEach(btn => {
        const on = state[btn.dataset.key];
        btn.classList.toggle('is-active', on);
        btn.setAttribute('aria-pressed', String(on));
      });
      stateHint.textContent = active.length
        ? `Active: ${active.map(labelFor).join(', ')}`
        : 'Active: All off';
      conditionalBlocks.forEach(({ block, combinations }) => {
        const isVisible = combinations.some(combo => combo.every(key => state[key]));
        block.classList.toggle('is-visible', isVisible);
      });
      document.dispatchEvent(new CustomEvent('filters-changed', { detail: { activeKeys: active } }));
    };

    toggles.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const group = btn.dataset.group;
        toggles.forEach(c => { if (c.dataset.group === group) state[c.dataset.key] = false; });
        state[key] = !state[key];
        updateState();
      });
    });

    // ─── Lightbox ──────────────────────────────────────────────────────────
    const openLightbox = (src, altText) => {
      lightboxImage.src = src;
      lightboxImage.alt = altText || '';
      lightbox.classList.add('is-open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      lightboxClose.focus();
    };
    const closeLightbox = () => {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImage.src = '';
      document.body.style.overflow = '';
    };
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
    });

    // ─── Init: wire up images and read-more inside a container ────────────
    const initBlock = (container) => {
      container.querySelectorAll('.demo-image').forEach(img => {
        img.addEventListener('click', () => openLightbox(img.src, img.alt));
        img.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(img.src, img.alt); }
        });
      });
      container.querySelectorAll('.read-more-btn').forEach(btn => {
        const body = btn.previousElementSibling;
        btn.addEventListener('click', () => {
          const expanded = body.classList.toggle('is-expanded');
          btn.classList.toggle('is-expanded', expanded);
          btn.setAttribute('aria-expanded', String(expanded));
          btn.querySelector('.btn-label').textContent = expanded ? 'Show Less' : 'Read More';
        });
      });
    };

    // ─── Load blocks from separate files ──────────────────────────────────
    const blockPlaceholders = Array.from(document.querySelectorAll('[data-block]'));
    const loads = blockPlaceholders.map(el =>
      fetch(el.dataset.block)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(html => {
          el.innerHTML = html;
          initBlock(el);
        })
        .catch(() => {
          el.innerHTML = '<p style="color:#888;padding:12px">Block could not be loaded.</p>';
        })
    );

    Promise.all(loads).then(() => {
      rebuildConditionalBlocks();
      updateState();
    });

    // ─── To-the-top button ─────────────────────────────────────────────────
    const toTopBtn = document.getElementById('to-top-btn');
    const onScroll = () => {
      toTopBtn.classList.toggle('is-visible', window.scrollY > 80);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    toTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>

</html>
